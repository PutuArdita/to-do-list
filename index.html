<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>To-Do List</h1>

      <div class="add-list">
        <input type="text" id="listInput" placeholder="Judul To-Do" />
        <!-- <button type="button" id="addListBtn">Tambah Daftar</button> -->
        <button type="button" id="addListBtn">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          Daftar
        </button>
      </div>

      <div id="listContainer"></div>
    </main>

    <script src="project.js"></script>
  </body>
</html>
